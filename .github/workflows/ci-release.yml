name: CI & TokenHub PR Risk Summary

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

permissions:
  contents: read
  pull-requests: write

jobs:
  verify:
    name: Lint, Typecheck & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies (if package.json exists)
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          elif [ -f pnpm-lock.yaml ]; then
            corepack enable && pnpm install --frozen-lockfile
          elif [ -f package.json ]; then
            npm install
          else
            echo "No package.json found — skipping Node install"
          fi

      - name: Run lint / typecheck / tests (auto-detected)
        run: |
          if [ -f package.json ]; then
            npm run --if-present lint
            npm run --if-present typecheck
            npm test --if-present
          else
            echo "Customize this step for your project stack (Go / Python / Rust / etc.)"
          fi

  tokenhub-pr-review:
    name: Headless PR Risk Summary (Tencent TokenHub API)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate Chinese PR Risk Summary via Tencent TokenHub API
        env:
          # 仅使用无头 API Key（严禁在远端 CI Runner 中使用个人订阅账号）
          TOKENHUB_API_KEY: ${{ secrets.TOKENHUB_API_KEY }}
          TOKENHUB_BASE_URL: ${{ secrets.TOKENHUB_BASE_URL || 'https://api.tokenhub.tencent.com/v1' }}
          TOKENHUB_MODEL: ${{ vars.TOKENHUB_REVIEW_MODEL || 'DeepSeek-V4.1-Flash-1017' }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ -z "$TOKENHUB_API_KEY" ]; then
            echo "::notice::TOKENHUB_API_KEY 未配置，跳过无头 PR 风险摘要（请在仓库 Secrets 中配置腾讯 TokenHub API Key）。"
            exit 0
          fi

          DIFF_CONTENT=$(git diff "$BASE_SHA...$HEAD_SHA" -- . ':(exclude)*.lock' ':(exclude)package-lock.json' | head -c 40000)
          if [ -z "$DIFF_CONTENT" ]; then
            echo "Empty diff — skipping review."
            exit 0
          fi

          node - <<'EOF'
          const { execSync } = require("node:child_process");
          const apiKey = process.env.TOKENHUB_API_KEY;
          const baseUrl = process.env.TOKENHUB_BASE_URL.replace(/\/+$/, "");
          const model = process.env.TOKENHUB_MODEL;
          const diff = execSync(
            `git diff "${process.env.BASE_SHA}...${process.env.HEAD_SHA}" -- . ':(exclude)*.lock' ':(exclude)package-lock.json'`,
            { encoding: "utf8", maxBuffer: 10 * 1024 * 1024 }
          ).slice(0, 40000);

          (async () => {
            const resp = await fetch(`${baseUrl}/chat/completions`, {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                "Authorization": `Bearer ${apiKey}`,
              },
              body: JSON.stringify({
                model,
                temperature: 0.2,
                messages: [
                  {
                    role: "system",
                    content: "你是无头 CI PR 风险审查助手。请用简洁中文输出：1) 变更概述；2) 潜在风险点（安全/并发/契约破坏/测试缺口，按高/中/低标注）；3) 合并前人工确认建议。控制在 300 字以内。"
                  },
                  {
                    role: "user",
                    content: `请审查以下 Pull Request Diff：\n\n${diff}`
                  }
                ]
              })
            });

            if (!resp.ok) {
              console.error(`TokenHub API error: HTTP ${resp.status} ${await resp.text()}`);
              process.exit(0); // 不因外部摘要接口抖动阻断主 CI
            }
            const data = await resp.json();
            const summary = data?.choices?.[0]?.message?.content?.trim();
            if (!summary) process.exit(0);

            const body = `### 🤖 TokenHub CI 风险摘要（\`${model}\`）\n\n${summary}\n\n> 注：本摘要由无头 CI 通过腾讯 TokenHub API 自动生成，最终合并需人工确认。`;
            require("node:fs").writeFileSync("/tmp/pr-summary.md", body);
            execSync(`gh pr comment "${process.env.PR_NUMBER}" --body-file /tmp/pr-summary.md`, { stdio: "inherit" });
          })().catch((e) => {
            console.error("TokenHub review skipped:", e.message);
          });
          EOF
